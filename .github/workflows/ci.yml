name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - '*.slnx'
              - '*.props'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: build-and-test (${{ matrix.runner.arch }})
    strategy:
      # ARM64 hosted runners are in public preview — don't let a flaky ARM64
      # run mask a real x64 regression (and vice versa).
      fail-fast: false
      matrix:
        runner:
          - { os: windows-latest, arch: x64,   dll: winfsp-x64.dll }
          - { os: windows-11-arm, arch: arm64, dll: winfsp-a64.dll }
    runs-on: ${{ matrix.runner.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install WinFsp
        shell: pwsh
        run: |
          choco install winfsp -y --params '/Developer'
          # WinFsp's MSI is arch-universal — it drops winfsp-x64.dll,
          # winfsp-a64.dll, and winfsp-x86.dll into the same bin folder on
          # every OS arch. We only assert the DLL the current runner will
          # actually load.
          $installDir = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\WinFsp' -ErrorAction SilentlyContinue).InstallDir
          if (-not $installDir) {
            Write-Error "WinFsp installation failed - InstallDir not in registry"
            exit 1
          }
          $dll = Join-Path $installDir "bin/${{ matrix.runner.dll }}"
          if (-not (Test-Path $dll)) {
            Write-Error "WinFsp installation failed - DLL not found: $dll"
            exit 1
          }
          Write-Host "WinFsp installed at: $installDir (verified $dll)"

      # The reparse integration test uses a UNC mount on this disposable runner.
      - name: Enable remote symbolic link evaluation
        run: fsutil behavior set SymlinkEvaluation R2R:1

      - name: Restore dependencies
        run: dotnet restore WinFsp.Native.slnx

      - name: Build
        run: dotnet build WinFsp.Native.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/WinFsp.Native.Tests/WinFsp.Native.Tests.csproj `
            -c Release --no-build --verbosity normal `
            --logger "trx;LogFileName=WinFsp.Native.Tests.${{ matrix.runner.arch }}.trx" `
            --results-directory ./TestResults `
            --collect:"XPlat Code Coverage"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results (${{ matrix.runner.arch }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          use-actions-summary: 'true'

      # Pack + upload only once — the nupkg is architecture-neutral managed
      # code, so we produce it on x64 and skip on ARM64.
      - name: Pack (verify)
        if: matrix.runner.arch == 'x64'
        run: dotnet pack src/WinFsp.Native/WinFsp.Native.csproj -c Release --no-build -o ./artifacts

      - name: Upload NuGet artifact
        if: matrix.runner.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
